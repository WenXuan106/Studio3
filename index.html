<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DECK/16 — Beat Studio</title>
<style>
  :root{
    --bg: #131110;
    --bg-panel: #1b1816;
    --bg-panel-2: #201c1a;
    --bg-panel-3: #262019;
    --line: #322c28;
    --text: #e9e2d8;
    --text-dim: #8c8178;
    --amber: #ffb020;
    --teal: #2dd4bf;
    --violet: #b98eff;
    --rose: #ff8fbf;
    --red: #ff5c5c;
    --step-off: #262220;
    --step-off-hi: #2c2724;
    font-size: 15px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  .app{ max-width: 1320px; margin: 0 auto; padding: 18px 18px 40px; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px; background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 14px; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 8px; z-index: 30;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-family: 'SFMono-Regular', Consolas, monospace; font-weight:700; font-size: 20px; letter-spacing:1px; color:var(--amber); }
  .brand .sub{ font-size:11px; color:var(--text-dim); letter-spacing: 2px; text-transform:uppercase; }
  .transport{ display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
  button.transport-btn{
    width:40px; height:40px; border-radius:8px; border:1px solid var(--line);
    background: var(--bg-panel-2); color:var(--text); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition: all .12s;
  }
  button.transport-btn:hover{ border-color: var(--amber); }
  #playBtn.playing{ background: var(--amber); color:#1a1300; border-color: var(--amber); }
  .field{ display:flex; flex-direction:column; gap:2px; }
  .field label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .field input[type=number]{
    width:56px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family: inherit;
  }
  input[type=range]{ accent-color: var(--amber); }
  .step-indicator{ display:flex; gap:2px; margin-left:6px; max-width:160px; flex-wrap:wrap; }
  .step-indicator span{ width:6px; height:6px; border-radius:50%; background: var(--step-off); }
  .step-indicator span.on{ background: var(--amber); }
  .bars-ctrl{ display:flex; align-items:center; gap:4px; }
  .bars-ctrl button{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--bg-panel-2);
    color:var(--text); cursor:pointer; font-size:14px; line-height:1;
  }
  .bars-ctrl button:hover{ border-color:var(--amber); }
  .bars-ctrl .bars-val{ font-size:12px; color:var(--text-dim); min-width:64px; text-align:center; }
  .bars-ctrl input[type=number]{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 4px; font-size:12px;
  }
  .bars-ctrl input[type=number]::-webkit-inner-spin-button,
  .bars-ctrl input[type=number]::-webkit-outer-spin-button{ opacity:0.5; }

  .panel{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .panel-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .panel-title h2{ margin:0; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); font-weight:600; }
  .panel-title .accent{ color: var(--amber); }
  .panel-title.teal .accent{ color: var(--teal); }
  .panel-title.violet .accent{ color: var(--violet); }
  .panel-title.rose .accent{ color: var(--rose); }

  button.action{
    background: var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:7px; font-size:12.5px; cursor:pointer; transition: border-color .12s;
  }
  button.action:hover{ border-color: var(--amber); }
  button.action.primary{ background: var(--amber); color:#1a1300; border-color:var(--amber); font-weight:600; }
  button.action.save{ background: var(--teal); color:#032b26; border-color:var(--teal); font-weight:600; }
  button.action.import{ background: var(--rose); color:#320019; border-color:var(--rose); font-weight:600; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .status{ font-size:11px; color:var(--text-dim); margin-top:8px; min-height:14px; }

  /* ---------- Track list / sequencer ---------- */
  .seq-scroll{ overflow-x:auto; padding-bottom:4px; }
  .seq-header-row{ display:flex; gap:5px; margin-bottom:6px; align-items:center; }
  .seq-header-fixed{ display:flex; gap:6px; flex-shrink:0; }
  .seq-header-grid{ display:flex; gap:5px; }
  .seq-header-grid .num{ width:22px; text-align:center; font-size:9.5px; color:var(--text-dim); flex-shrink:0; }
  .seq-header-grid .num.beat{ color: var(--amber); font-weight:700; }
  .seq-header-grid .num.barstart{ border-left:1px solid var(--line); padding-left:2px; }

  .track-row{
    display:flex; gap:6px; align-items:center; padding:4px 0;
  }
  .track-row + .track-row{ border-top: 1px solid #221f1c; }
  .track-fixed{ display:flex; align-items:center; gap:6px; width:266px; flex-shrink:0; }
  .track-name-wrap{ width:150px; overflow:hidden; }
  .track-name{ font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-inst{ font-size:9.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-controls{ display:flex; gap:3px; align-items:center; }
  .mini-btn{
    width:19px; height:19px; border-radius:4px; border:1px solid var(--line);
    background: transparent; color:var(--text-dim); font-size:9.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;
  }
  .mini-btn:hover{ border-color:var(--amber); }
  .mini-btn.mute.active{ background: var(--red); color:#2a0000; border-color:var(--red); }
  .mini-btn.solo.active{ background: var(--teal); color:#032b26; border-color:var(--teal); }
  .mini-btn.edit.active{ background: var(--violet); color:#1b0a33; border-color:var(--violet); }
  .mini-btn.del{ color: var(--red); }
  .track-vol{ width:44px; }
  .track-grid{ display:flex; gap:5px; }
  .step{
    width:22px; height:24px; border-radius:5px; background: var(--step-off); border:1px solid transparent;
    cursor:pointer; transition: background .06s, transform .06s; flex-shrink:0;
  }
  .step.beat3{ background: var(--step-off-hi); }
  .step.barstart{ border-left:1px solid #3a332d; }
  .step.active{ background: var(--amber); box-shadow: 0 0 8px rgba(255,176,32,.35); }
  .step.playhead{ border-color: rgba(255,255,255,.5); }
  .step:hover{ transform: scale(0.93); }
  .step.melodic-block{ background: var(--step-off); }
  .step.melodic-block.active{ background: var(--violet); box-shadow: 0 0 8px rgba(185,142,255,.35); }

  .empty-tracks{ color:var(--text-dim); font-size:12.5px; padding:10px 2px; }

  /* ---------- Instrument picker ---------- */
  .inst-picker{ display:none; margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
  .inst-picker.open{ display:block; }
  .inst-search{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:8px 10px; font-family:inherit; font-size:12.5px; margin-bottom:10px;
  }
  .inst-cat{ margin-bottom:10px; }
  .inst-cat-title{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--amber); margin-bottom:6px; }
  .inst-grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .inst-btn{
    background: var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 11px; border-radius:7px; font-size:11.5px; cursor:pointer; transition:border-color .1s;
  }
  .inst-btn:hover{ border-color: var(--teal); background: var(--bg-panel-3); }
  .inst-btn.drum{ border-left:3px solid var(--amber); }
  .inst-btn.melodic{ border-left:3px solid var(--teal); }

  /* ---------- Piano roll editor ---------- */
  .roll-editor{ display:none; }
  .roll-editor.open{ display:block; }
  .roll-scroll{
    max-height:460px; overflow-y:auto; overflow-x:auto; border:1px solid var(--line); border-radius:8px;
    background: #17140f;
  }
  .roll-inner{ display:inline-block; min-width:100%; }

  /* Sticky bar/beat ruler along the top, scrolls horizontally with the grid */
  .roll-ruler{
    display:flex; position:sticky; top:0; z-index:6; background:#1d1812; border-bottom:1px solid var(--line);
  }
  .roll-ruler-spacer{ width:52px; flex-shrink:0; position:sticky; left:0; z-index:7; background:#1d1812; border-right:1px solid var(--line); }
  .roll-ruler-cell{
    width:20px; flex-shrink:0; text-align:center; font-size:9px; color:var(--text-dim); padding-top:5px; box-sizing:border-box;
    border-left:1px solid transparent;
  }
  .roll-ruler-cell.barstart{ border-left:1px solid #3a332d; color:var(--amber); font-weight:700; font-size:10px; }

  .roll-row{ display:flex; align-items:stretch; }
  .roll-row.black-row .cell{ background:#221d18; }
  .roll-row.black-row .cell.beat3{ background:#28221b; }

  /* Piano key strip — mimics a real keyboard laid on its side, sticky while scrolling sideways */
  .roll-key{
    width:52px; flex-shrink:0; position:sticky; left:0; z-index:5;
    display:flex; align-items:center; justify-content:flex-end; padding-right:6px;
    font-size:9px; box-sizing:border-box; border-bottom:1px solid rgba(0,0,0,.35);
    border-right:1px solid var(--line);
  }
  .roll-key.white-k{ background:#e9e2d8; color:#8a8072; }
  .roll-key.black-k{ background:#221d19; color:#8a8072; }
  .roll-key.c-note{ background: var(--amber); color:#1a1300; font-weight:700; }

  .cell{ width:20px; height:18px; border-radius:3px; background: var(--step-off); cursor:pointer; flex-shrink:0; margin:1px 0 0 0; touch-action:none; user-select:none; }
  .cell.beat3{ background: var(--step-off-hi); }
  .cell.barstart{ border-left:1px solid #3a332d; }
  /* Active cells merge into one continuous GarageBand-style note block when consecutive steps share a note */
  .cell.active{ background: var(--teal); border-top:1px solid #0a6b60; border-bottom:1px solid #0a6b60; border-radius:0; box-shadow:none; }
  .cell.active:not(.run-start){ border-left:none; }
  .cell.active:not(.run-end){ border-right:none; }
  .cell.active.run-start{ border-radius:4px 0 0 4px; border-left:1px solid #0a6b60; box-shadow: -1px 0 6px rgba(45,212,191,.4); }
  .cell.active.run-end{ border-radius:0 4px 4px 0; border-right:1px solid #0a6b60; box-shadow: 1px 0 6px rgba(45,212,191,.4); }
  .cell.active.run-start.run-end{ border-radius:4px; box-shadow: 0 0 6px rgba(45,212,191,.4); }
  .roll-editor-close{ float:right; }

  .mixer-grid{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .strip{
    background: var(--bg-panel-2); border:1px solid var(--line); border-radius:8px;
    padding:9px 6px; width:66px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .strip .strip-name{ font-size:9.5px; color:var(--text-dim); text-align:center; line-height:1.2; }
  .strip input[type=range]{ writing-mode: vertical-lr; direction: rtl; width:18px; height:80px; }
  .strip .val{ font-size:9.5px; color: var(--text); }

  select{
    background: var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:inherit; font-size:12px;
  }

  /* ---------- Piano ---------- */
  .piano-wrap{ overflow-x:auto; padding: 6px 0 2px; }
  .piano{ position:relative; height:120px; }
  .white-key{
    position:absolute; top:0; width:38px; height:120px; background:#efe7da; border:1px solid #14110f;
    border-radius:0 0 5px 5px; cursor:pointer; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:6px; font-size:9px; color:#8a8072; user-select:none;
  }
  .white-key:hover{ background:#e2d8c6; }
  .white-key.active{ background: var(--amber); }
  .black-key-piano{
    position:absolute; top:0; width:24px; height:72px; background:#171412; border:1px solid #000;
    border-radius:0 0 4px 4px; cursor:pointer; z-index:2; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:5px; font-size:8px; color:#a89a86; user-select:none;
  }
  .black-key-piano:hover{ background:#2a2420; }
  .black-key-piano.active{ background: var(--amber); }
  .piano-hint{ font-size:10.5px; color:var(--text-dim); margin-top:6px; }
  .piano-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .oct-ctrl{ display:flex; align-items:center; gap:4px; }
  .oct-ctrl button{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); cursor:pointer; }
  .oct-ctrl button:hover{ border-color:var(--amber); }
  .oct-val{ font-size:11px; color:var(--text-dim); min-width:70px; text-align:center; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="mark">DECK/16</span>
      <span class="sub">beat studio</span>
    </div>
    <div class="transport">
      <button class="transport-btn" id="playBtn" title="Play/Stop">▶</button>
      <div class="field"><label>BPM</label><input type="number" id="bpmInput" value="120" min="40" max="220"></div>
      <div class="field"><label>Master</label><input type="range" id="masterVol" min="0" max="100" value="80" style="width:90px;"></div>
      <div class="field">
        <label>Bars</label>
        <div class="bars-ctrl">
          <button id="barMinus">−</button>
          <input type="number" id="barsInput" class="mono" min="1" step="1" value="4" style="width:64px; text-align:center;">
          <button id="barPlus">+</button>
        </div>
      </div>
      <div class="step-indicator" id="stepIndicator"></div>
    </div>
  </header>

  <div class="panel">
    <div class="panel-title">
      <h2><span class="accent">Track</span> Sequencer — <span id="instCountLabel">0</span> instruments available</h2>
      <div class="actions">
        <button class="action primary" id="addTrackBtn">+ Add Track</button>
      </div>
    </div>

    <div class="inst-picker" id="instPicker">
      <input type="text" class="inst-search" id="instSearch" placeholder="Search instruments…">
      <div id="instCatWrap"></div>
    </div>

    <div class="seq-scroll">
      <div class="seq-header-row">
        <div class="seq-header-fixed" style="width:266px;"></div>
        <div class="seq-header-grid" id="seqHeader"></div>
      </div>
      <div id="trackList"></div>
    </div>
  </div>

  <div class="panel roll-editor" id="rollEditorPanel">
    <div class="panel-title violet">
      <h2><span class="accent">Piano Roll</span> — <span id="rollTrackName">—</span></h2>
      <button class="action" id="closeRollBtn">Close</button>
    </div>
    <div class="roll-scroll" id="rollScroll">
      <div id="pianoRoll"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>Play — Virtual Piano</h2>
      <div class="piano-toolbar">
        <div class="field">
          <label>Instrument</label>
          <select id="pianoInstrument"></select>
        </div>
        <div class="oct-ctrl">
          <button id="octDown">−</button>
          <span class="oct-val mono" id="octVal">Octave 3</span>
          <button id="octUp">+</button>
        </div>
      </div>
    </div>
    <div class="piano-wrap"><div class="piano" id="piano"></div></div>
    <div class="piano-hint">Click keys to play, or use your computer keyboard: <span class="mono">A W S E D F T G Y H U J K O L P</span> — use <span class="mono">Z / X</span> to shift octaves.</div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>Mixer</h2>
    </div>
    <div class="mixer-grid" id="mixer"></div>
  </div>

  <div class="panel">
    <div class="actions">
      <button class="action primary" id="randomizeBtn">Randomize pattern</button>
      <button class="action" id="clearBtn">Clear all</button>
      <button class="action save" id="saveBtn">Save pattern</button>
      <button class="action" id="loadBtn">Load pattern</button>
      <button class="action" id="exportMidiBtn">Export MIDI (.mid)</button>
      <button class="action save" id="exportAudioBtn">Export Audio (.wav)</button>
      <button class="action import" id="importMidiBtn">Import MIDI (.mid)</button>
      <input type="file" id="midiFileInput" accept=".mid,.midi" style="display:none;">
    </div>
    <div class="status" id="statusMsg"></div>
  </div>

</div>
<script>
(function(){
  "use strict";
  const STEP_PER_BAR = 16;
  let bars = 4;
  let totalSteps = bars * STEP_PER_BAR;

  // ============================================================
  // Instrument library — all synthesized (no external samples)
  // ============================================================
  const DRUM_INSTRUMENTS = [
    // Kicks
    {id:'kick808', name:'808 Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:150, freqEnd:40, decay:0.30, vol:0.9},
    {id:'kickAcoustic', name:'Acoustic Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:120, freqEnd:55, decay:0.22, vol:0.85},
    {id:'kickSub', name:'Sub Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:70, freqEnd:30, decay:0.5, vol:0.75},
    {id:'kickPunchy', name:'Punchy Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'triangle', freq:180, freqEnd:50, decay:0.18, vol:0.9},
    {id:'kickLofi', name:'Lo-Fi Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:100, freqEnd:45, decay:0.35, vol:0.7},
    {id:'kickTrap', name:'Trap Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:160, freqEnd:35, decay:0.45, vol:0.85},
    {id:'kickHouse', name:'House Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'sine', freq:140, freqEnd:48, decay:0.28, vol:0.9},
    {id:'kickTechno', name:'Techno Kick', cat:'Kicks', kind:'drum', engine:'tone', wave:'square', freq:130, freqEnd:42, decay:0.25, vol:0.85},

    // Snares & Claps
    {id:'snareAcoustic', name:'Acoustic Snare', cat:'Snares & Claps', kind:'drum', engine:'tonenoise', toneFreq:180, toneDecay:0.12, noiseFreq:1000, noiseDecay:0.18, vol:0.8},
    {id:'snareRim', name:'Rimshot', cat:'Snares & Claps', kind:'drum', engine:'click', freq:1400, decay:0.05, wave:'square', vol:0.6},
    {id:'snareLofi', name:'Lo-Fi Snare', cat:'Snares & Claps', kind:'drum', engine:'tonenoise', toneFreq:150, toneDecay:0.1, noiseFreq:800, noiseDecay:0.15, vol:0.7},
    {id:'snareTrap', name:'Trap Snare', cat:'Snares & Claps', kind:'drum', engine:'tonenoise', toneFreq:200, toneDecay:0.14, noiseFreq:1200, noiseDecay:0.22, vol:0.8},
    {id:'snareBrush', name:'Brush Snare', cat:'Snares & Claps', kind:'drum', engine:'noise', filterType:'bandpass', filterFreq:2000, q:0.8, decay:0.3, vol:0.5},
    {id:'snarePiccolo', name:'Piccolo Snare', cat:'Snares & Claps', kind:'drum', engine:'tonenoise', toneFreq:260, toneDecay:0.08, noiseFreq:1600, noiseDecay:0.12, vol:0.75},
    {id:'clap', name:'Clap', cat:'Snares & Claps', kind:'drum', engine:'clap', repeats:3, spacing:0.012, filterFreq:1200, decay:0.08, vol:0.7},
    {id:'clapAnalog', name:'Analog Clap', cat:'Snares & Claps', kind:'drum', engine:'clap', repeats:4, spacing:0.01, filterFreq:1500, decay:0.1, vol:0.7},
    {id:'clapWide', name:'Wide Clap', cat:'Snares & Claps', kind:'drum', engine:'clap', repeats:5, spacing:0.014, filterFreq:1000, decay:0.14, vol:0.65},

    // Hats & Cymbals
    {id:'hatClosed', name:'Hat Closed', cat:'Hats & Cymbals', kind:'drum', engine:'noise', filterType:'highpass', filterFreq:7000, q:0.5, decay:0.06, vol:0.6},
    {id:'hatOpen', name:'Hat Open', cat:'Hats & Cymbals', kind:'drum', engine:'noise', filterType:'highpass', filterFreq:7000, q:0.5, decay:0.3, vol:0.5},
    {id:'hatPedal', name:'Hat Pedal', cat:'Hats & Cymbals', kind:'drum', engine:'noise', filterType:'highpass', filterFreq:6000, q:0.4, decay:0.1, vol:0.45},
    {id:'hatTrapTight', name:'Trap Hat Tight', cat:'Hats & Cymbals', kind:'drum', engine:'noise', filterType:'highpass', filterFreq:8500, q:0.6, decay:0.04, vol:0.55},

  const INSTRUMENTS = DRUM_INSTRUMENTS.concat(MELODIC_INSTRUMENTS);
  const INSTRUMENTS_BY_ID = {};
  INSTRUMENTS.forEach(inst => { INSTRUMENTS_BY_ID[inst.id] = inst; });
  const CATEGORY_ORDER = [
    'Kicks','Snares & Claps','Hats & Cymbals','Toms & Drums','World Percussion','Electronic Percussion',
    'Keys','Bass','Guitars','Leads','Plucks','Pads & Strings','Wind & Brass','World Melodic','Vocal & Choir','Synth Bells','Orchestral Hits','FX & Chip'
  ];

  // Auto-assign GM-ish MIDI note / program numbers for export
  const DRUM_MIDI_MAP = {};
  DRUM_INSTRUMENTS.forEach((inst, i) => { DRUM_MIDI_MAP[inst.id] = 35 + (i % 46); });
  const CATEGORY_PROGRAM = {
    'Keys':0, 'Bass':38, 'Guitars':25, 'Leads':81, 'Plucks':45, 'Pads & Strings':89,
    'Wind & Brass':61, 'World Melodic':104, 'Vocal & Choir':52, 'Synth Bells':112, 'Orchestral Hits':55, 'FX & Chip':99
  };

  // ============================================================
  // Note range — wide pitch range (C1 .. B7), high to low
  // ============================================================
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  function buildNoteRange(lowOct, highOct){
    const out = [];
    for(let oct = highOct; oct >= lowOct; oct--){
      for(let i = NOTE_NAMES.length - 1; i >= 0; i--){
        out.push(NOTE_NAMES[i] + oct);
      }
    }
    return out;
  }
  const NOTE_RANGE = buildNoteRange(1, 7); // C1 .. B7, high to low, 84 notes

  // ============================================================
  // State
  // ============================================================
  let tracks = [];
  let nextTrackId = 1;
  let selectedTrackId = null;
  let isPlaying = false, currentStep = 0, bpm = 120;
  let audioCtx = null, masterGain = null;
  let nextNoteTime = 0, timerID = null;
  const scheduleAheadTime = 0.12, lookahead = 25;
  let keyboardOctave = 3;

  function noteFreq(name){
    const A4 = 440;
    const m = name.match(/([A-G]#?)(\d)/);
    const n = NOTE_NAMES.indexOf(m[1]);
    const octave = parseInt(m[2],10);
    const semitonesFromA4 = (octave-4)*12 + (n-9);
    return A4 * Math.pow(2, semitonesFromA4/12);
  }
  function noteNameToMidi(name){
    const m = name.match(/([A-G]#?)(\d)/);
    const n = NOTE_NAMES.indexOf(m[1]);
    const octave = parseInt(m[2],10);
    return (octave+1)*12 + n;
  }

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = document.getElementById('masterVol').value/100;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
  }
  // A fresh random noise buffer used to be generated on every single hit, which
  // is wasteful — for songs with thousands of hat/snare/clap hits (long imported
  // MIDI files especially) that added up to a huge amount of redundant work and
  // made rendering/exporting painfully slow. Instead, build a small reusable pool
  // once per AudioContext and pick from it — keeps some natural variation between
  // hits without resynthesizing noise every time.
  let noiseBufferPool = null, noiseBufferPoolCtx = null;
  function getNoiseBufferPool(){
    if(noiseBufferPool && noiseBufferPoolCtx === audioCtx) return noiseBufferPool;
    const bufferSize = audioCtx.sampleRate * 0.6;
    const pool = [];
    for(let p=0;p<4;p++){
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      pool.push(buffer);
    }
    noiseBufferPool = pool; noiseBufferPoolCtx = audioCtx;
    return pool;
  }
  function noiseBuffer(){
    const pool = getNoiseBufferPool();
    return pool[(Math.random()*pool.length)|0];
  }
  function trackGainNode(vol, time){
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.connect(masterGain);
    return g;
  }

  // ---------- Generic drum engine ----------
  function playDrumInstrument(time, inst, vol){
    const g = trackGainNode(vol, time);
    switch(inst.engine){
      case 'tone': {
        const osc = audioCtx.createOscillator(); osc.type = inst.wave||'sine';
        osc.frequency.setValueAtTime(inst.freq, time);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, inst.freqEnd||inst.freq*0.6), time+inst.decay);
        const eg = audioCtx.createGain();
        eg.gain.setValueAtTime(1, time); eg.gain.exponentialRampToValueAtTime(0.001, time+inst.decay);
        osc.connect(eg); eg.connect(g); osc.start(time); osc.stop(time+inst.decay+0.02);
        break;
      }
      case 'noise': {
        const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer();
        const filt = audioCtx.createBiquadFilter(); filt.type = inst.filterType||'highpass';
        filt.frequency.value = inst.filterFreq||5000; filt.Q.value = inst.q||0.5;
        const eg = audioCtx.createGain();
        eg.gain.setValueAtTime(1, time); eg.gain.exponentialRampToValueAtTime(0.001, time+inst.decay);
        noise.connect(filt); filt.connect(eg); eg.connect(g); noise.start(time); noise.stop(time+inst.decay+0.02);
        break;
      }
      case 'tonenoise': {
        const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer();
        const filt = audioCtx.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = inst.noiseFreq||1000;
        const neg = audioCtx.createGain();
        neg.gain.setValueAtTime(1, time); neg.gain.exponentialRampToValueAtTime(0.001, time+inst.noiseDecay);
        noise.connect(filt); filt.connect(neg); neg.connect(g);
        const osc = audioCtx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = inst.toneFreq;
        const oeg = audioCtx.createGain();
        oeg.gain.setValueAtTime(0.6, time); oeg.gain.exponentialRampToValueAtTime(0.001, time+inst.toneDecay);
        osc.connect(oeg); oeg.connect(g);
        noise.start(time); noise.stop(time+inst.noiseDecay+0.02); osc.start(time); osc.stop(time+inst.toneDecay+0.02);
        break;
      }
      case 'metallic': {
        const eg = audioCtx.createGain();
        eg.gain.setValueAtTime(1, time); eg.gain.exponentialRampToValueAtTime(0.001, time+inst.decay);
        eg.connect(g);
        (inst.freqs||[800]).forEach(f=>{
          const osc = audioCtx.createOscillator(); osc.type = inst.wave||'square'; osc.frequency.value = f;
          const og = audioCtx.createGain(); og.gain.value = inst.mix||0.3;
          osc.connect(og); og.connect(eg); osc.start(time); osc.stop(time+inst.decay+0.02);
        });
        if(inst.noiseFreq){
          const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer();
          const filt = audioCtx.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = inst.noiseFreq;
          noise.connect(filt); filt.connect(eg); noise.start(time); noise.stop(time+inst.decay+0.02);
        }
        break;
      }
      case 'clap': {
        for(let i=0;i<(inst.repeats||3);i++){
          const t = time + i*(inst.spacing||0.012);
          const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer();
          const filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = inst.filterFreq||1200;
          const eg = audioCtx.createGain();
          eg.gain.setValueAtTime(0.8, t); eg.gain.exponentialRampToValueAtTime(0.001, t+inst.decay);
          noise.connect(filt); filt.connect(eg); eg.connect(g); noise.start(t); noise.stop(t+inst.decay+0.02);
        }
        break;
      }
      case 'click': {
        const osc = audioCtx.createOscillator(); osc.type = inst.wave||'square'; osc.frequency.setValueAtTime(inst.freq, time);
        const eg = audioCtx.createGain();
        eg.gain.setValueAtTime(0.6, time); eg.gain.exponentialRampToValueAtTime(0.001, time+inst.decay);
        osc.connect(eg); eg.connect(g); osc.start(time); osc.stop(time+inst.decay+0.02);
        break;
      }
    }
  }

  // ---------- Generic melodic engine ----------
  function playMelodicInstrument(time, freq, inst, gainMul){
    const vol = (inst.vol||0.5) * (gainMul!==undefined ? gainMul : 1);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(vol, time); g.connect(masterGain);
    let dest = g;
    if(inst.filterType){
      const filt = audioCtx.createBiquadFilter();
      filt.type = inst.filterType; filt.frequency.value = inst.filterFreq||2000; filt.Q.value = inst.filterQ||1;
      filt.connect(g); dest = filt;
    }
    const eg = audioCtx.createGain(); eg.connect(dest);
    let dur;
    if(inst.pluck){ dur = inst.decayTime || 0.5; }
    else { dur = (60/bpm) * (inst.durBeats || 1.0); }
    eg.gain.setValueAtTime(0.0001, time);
    eg.gain.linearRampToValueAtTime(1, time + (inst.attack||0.01));
    eg.gain.exponentialRampToValueAtTime(0.001, time + dur);
    const unison = (inst.unison && inst.unison.length) ? inst.unison : [0];
    unison.forEach(cents=>{
      const osc = audioCtx.createOscillator(); osc.type = inst.wave||'sine';
      osc.frequency.setValueAtTime(freq, time); osc.detune.setValueAtTime(cents, time);
      if(inst.vibratoRate && inst.vibratoDepth){
        const lfo = audioCtx.createOscillator(); lfo.frequency.value = inst.vibratoRate;
        const lfoGain = audioCtx.createGain(); lfoGain.gain.value = inst.vibratoDepth;
        lfo.connect(lfoGain); lfoGain.connect(osc.detune); lfo.start(time); lfo.stop(time+dur+0.05);
      }
      osc.connect(eg); osc.start(time); osc.stop(time+dur+0.05);
    });
    if(inst.sub){
      const sub = audioCtx.createOscillator(); sub.type = 'sine';
      sub.frequency.setValueAtTime(freq*inst.sub, time);
      const subGain = audioCtx.createGain(); subGain.gain.value = inst.subMix||0.3;
      sub.connect(subGain); subGain.connect(eg); sub.start(time); sub.stop(time+dur+0.05);
    }
  }

  function triggerTrackAudio(track, time){
    if(track.mute) return;
    const anySolo = tracks.some(t=>t.solo);
    if(anySolo && !track.solo) return;
    const inst = INSTRUMENTS_BY_ID[track.instId];
    if(!inst) return;
    if(inst.kind === 'drum') playDrumInstrument(time, inst, track.vol);
  }

  // ============================================================
  // Scheduler
  // ============================================================
  function scheduler(){
    while(nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
      scheduleStep(currentStep, nextNoteTime);
      const secondsPerStep = (60/bpm)/4;
      nextNoteTime += secondsPerStep;
      currentStep = (currentStep+1) % totalSteps;
    }
    timerID = setTimeout(scheduler, lookahead);
  }
  let uiStep = 0;
  function scheduleStep(step, time){
    tracks.forEach(track=>{
      const val = track.pattern[step];
      if(track.kind === 'drum'){
        if(val) triggerTrackAudio(track, time);
      } else if(track.kind === 'melodic'){
        if(val !== null && val !== undefined){
          if(track.mute) return;
          const anySolo = tracks.some(t=>t.solo);
          if(anySolo && !track.solo) return;
          const inst = INSTRUMENTS_BY_ID[track.instId];
          if(inst) playMelodicInstrument(time, noteFreq(NOTE_RANGE[val]), inst, track.vol);
        }
      }
    });
    const delay = (time - audioCtx.currentTime)*1000;
    setTimeout(()=>{ uiStep = step; updatePlayhead(); }, Math.max(0,delay));
  }
  function updatePlayhead(){
    document.querySelectorAll('.step, .cell').forEach(el=>{
      el.classList.toggle('playhead', parseInt(el.dataset.step,10)===uiStep);
    });
    document.querySelectorAll('#stepIndicator span').forEach((el,i)=>{
      el.classList.toggle('on', i===uiStep);
    });
  }
  function play(){
    ensureAudio(); isPlaying = true; currentStep = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
    document.getElementById('playBtn').textContent='■';
    document.getElementById('playBtn').classList.add('playing');
  }
  function stop(){
    isPlaying = false; clearTimeout(timerID);
    document.getElementById('playBtn').textContent='▶';
    document.getElementById('playBtn').classList.remove('playing');
    document.querySelectorAll('.playhead').forEach(el=>el.classList.remove('playhead'));
    document.querySelectorAll('#stepIndicator span').forEach(el=>el.classList.remove('on'));
  }

  // ============================================================
  // Track list / sequencer UI
  // ============================================================
  function buildStepIndicator(){
    const el = document.getElementById('stepIndicator'); el.innerHTML='';
    const showCount = Math.min(totalSteps, 64);
    for(let i=0;i<showCount;i++){ el.appendChild(document.createElement('span')); }
  }
  function buildSeqHeader(){
    document.getElementById('barsInput').value = bars;
    const el = document.getElementById('seqHeader');
    el.innerHTML = '';
    for(let i=0;i<totalSteps;i++){
      const d = document.createElement('div');
      d.className = 'num' + (i%4===0 ? ' beat':'') + (i%STEP_PER_BAR===0 ? ' barstart':'');
      d.textContent = i%STEP_PER_BAR===0 ? (Math.floor(i/STEP_PER_BAR)+1) : (i%4===0 ? '·':'');
      el.appendChild(d);
    }
    buildStepIndicator();
  }

  function newTrackFromInstrument(inst){
    return {
      id: nextTrackId++,
      name: inst.name,
      instId: inst.id,
      kind: inst.kind,
      pattern: new Array(totalSteps).fill(inst.kind==='drum' ? false : null),
      vol: inst.vol!==undefined ? inst.vol : 0.6,
      mute: false,
      solo: false
    };
  }

  function buildTrackList(){
    const wrap = document.getElementById('trackList');
    wrap.innerHTML = '';
    if(tracks.length===0){
      const e = document.createElement('div'); e.className='empty-tracks';
      e.textContent = 'No tracks yet — click "+ Add Track" to choose an instrument.';
      wrap.appendChild(e);
      return;
    }
    tracks.forEach(track=>{
      const inst = INSTRUMENTS_BY_ID[track.instId];
      const row = document.createElement('div'); row.className='track-row';

      const fixed = document.createElement('div'); fixed.className='track-fixed';
      const nameWrap = document.createElement('div'); nameWrap.className='track-name-wrap';
      const nameEl = document.createElement('div'); nameEl.className='track-name'; nameEl.textContent = track.name;
      const instEl = document.createElement('div'); instEl.className='track-inst'; instEl.textContent = (inst?inst.cat:'') + ' · ' + (track.kind==='drum'?'drum':'melodic');
      nameWrap.appendChild(nameEl); nameWrap.appendChild(instEl);
      fixed.appendChild(nameWrap);

      const ctrl = document.createElement('div'); ctrl.className='track-controls';
      const muteBtn = document.createElement('button'); muteBtn.className='mini-btn mute'+(track.mute?' active':''); muteBtn.textContent='M';
      muteBtn.onclick=()=>{ track.mute=!track.mute; muteBtn.classList.toggle('active', track.mute); };
      const soloBtn = document.createElement('button'); soloBtn.className='mini-btn solo'+(track.solo?' active':''); soloBtn.textContent='S';
      soloBtn.onclick=()=>{ track.solo=!track.solo; soloBtn.classList.toggle('active', track.solo); };
      ctrl.appendChild(muteBtn); ctrl.appendChild(soloBtn);

      if(track.kind==='melodic'){
        const editBtn = document.createElement('button'); editBtn.className='mini-btn edit'+(selectedTrackId===track.id?' active':''); editBtn.textContent='♪';
        editBtn.title='Open piano roll';
        editBtn.onclick=()=>{
          if(selectedTrackId===track.id){ closeRollEditor(); }
          else { openRollEditor(track.id); }
        };
        ctrl.appendChild(editBtn);
      }
      const delBtn = document.createElement('button'); delBtn.className='mini-btn del'; delBtn.textContent='✕'; delBtn.title='Remove track';
      delBtn.onclick=()=>{
        tracks = tracks.filter(t=>t.id!==track.id);
        if(selectedTrackId===track.id) closeRollEditor();
        buildTrackList(); buildMixer();
      };
      ctrl.appendChild(delBtn);
      fixed.appendChild(ctrl);
      row.appendChild(fixed);

      const grid = document.createElement('div'); grid.className='track-grid';
      for(let i=0;i<totalSteps;i++){
        const step = document.createElement('div');
        const isMelodic = track.kind==='melodic';
        step.className = 'step' + (i%4===2?' beat3':'') + (i%STEP_PER_BAR===0?' barstart':'') + (isMelodic?' melodic-block':'');
        step.dataset.step = i;
        if(isMelodic){
          if(track.pattern[i]!==null && track.pattern[i]!==undefined) step.classList.add('active');
          step.title = 'Open piano roll to edit notes';
          step.onclick = ()=>{ openRollEditor(track.id); scrollRollToStep(i); };
        } else {
          if(track.pattern[i]) step.classList.add('active');
          step.onclick = ()=>{
            track.pattern[i] = !track.pattern[i];
            step.classList.toggle('active', track.pattern[i]);
            if(track.pattern[i]){ ensureAudio(); triggerTrackAudio(track, audioCtx.currentTime+0.02); }
          };
        }
        grid.appendChild(step);
      }
      row.appendChild(grid);
      wrap.appendChild(row);
    });
  }

  // ============================================================
  // Instrument picker
  // ============================================================
  function buildInstrumentPicker(){
    document.getElementById('instCountLabel').textContent = INSTRUMENTS.length;
    renderInstrumentCategories('');
    document.getElementById('instSearch').oninput = (e)=> renderInstrumentCategories(e.target.value.trim().toLowerCase());
  }
  function renderInstrumentCategories(filter){
    const wrap = document.getElementById('instCatWrap');
    wrap.innerHTML = '';
    CATEGORY_ORDER.forEach(cat=>{
      const list = INSTRUMENTS.filter(inst=> inst.cat===cat && (!filter || inst.name.toLowerCase().includes(filter)));
      if(list.length===0) return;
      const catDiv = document.createElement('div'); catDiv.className='inst-cat';
      const title = document.createElement('div'); title.className='inst-cat-title'; title.textContent = cat + ' (' + list.length + ')';
      const grid = document.createElement('div'); grid.className='inst-grid';
      list.forEach(inst=>{
        const btn = document.createElement('button');
        btn.className = 'inst-btn ' + inst.kind;
        btn.textContent = inst.name;
        btn.onclick = ()=>{
          const t = newTrackFromInstrument(inst);
          tracks.push(t);
          buildTrackList(); buildMixer(); buildStepIndicator();
          document.getElementById('instPicker').classList.remove('open');
          setStatus('Added track: ' + inst.name);
        };
        grid.appendChild(btn);
      });
      catDiv.appendChild(title); catDiv.appendChild(grid);
      wrap.appendChild(catDiv);
    });
  }

  // ============================================================
  // Piano roll editor (per selected melodic track)
  // ============================================================
  function openRollEditor(trackId){
    selectedTrackId = trackId;
    const track = tracks.find(t=>t.id===trackId);
    if(!track) return;
    document.getElementById('rollEditorPanel').classList.add('open');
    document.getElementById('rollTrackName').textContent = track.name;
    buildRollEditor(track);
    buildTrackList();
  }
  function closeRollEditor(){
    selectedTrackId = null;
    document.getElementById('rollEditorPanel').classList.remove('open');
    buildTrackList();
  }
  function buildRollEditor(track){
    const wrap = document.getElementById('pianoRoll');
    wrap.innerHTML = '';
    const inner = document.createElement('div'); inner.className = 'roll-inner';

    // Sticky ruler: bar numbers along the top, like a timeline
    const ruler = document.createElement('div'); ruler.className = 'roll-ruler';
    const spacer = document.createElement('div'); spacer.className = 'roll-ruler-spacer';
    ruler.appendChild(spacer);
    for(let i=0;i<totalSteps;i++){
      const rc = document.createElement('div');
      const isBarStart = i % STEP_PER_BAR === 0;
      rc.className = 'roll-ruler-cell' + (isBarStart ? ' barstart' : '');
      rc.textContent = isBarStart ? String(Math.floor(i/STEP_PER_BAR)+1) : '';
      ruler.appendChild(rc);
    }
    inner.appendChild(ruler);

    // Note rows, each with a real piano key on the left
    NOTE_RANGE.forEach((note, ni)=>{
      const isBlack = note.includes('#');
      const isC = note.startsWith('C') && !isBlack;
      const row = document.createElement('div'); row.className='roll-row' + (isBlack ? ' black-row' : '');

      const key = document.createElement('div');
      key.className = 'roll-key mono ' + (isC ? 'c-note' : (isBlack ? 'black-k' : 'white-k'));
      key.textContent = isC ? note : (isBlack ? '' : note.replace(/[0-9]+$/,''));
      row.appendChild(key);

      for(let i=0;i<totalSteps;i++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (i%4===2?' beat3':'') + (i%STEP_PER_BAR===0?' barstart':'');
        cell.dataset.step = i; cell.dataset.note = ni;
        if(track.pattern[i]===ni){
          cell.classList.add('active');
          if(track.pattern[i-1]!==ni) cell.classList.add('run-start');
          if(track.pattern[i+1]!==ni) cell.classList.add('run-end');
        }
        cell.onpointerdown = (e)=>{
          e.preventDefault();
          const wasActive = track.pattern[i]===ni;
          const mode = wasActive ? 'erase' : 'paint';
          rollDrag = { track, wrap, ni, mode, lastStep:null };
          paintRollCell(i, ni, track, wrap, mode);
          refreshRollRowMerge(wrap, track, ni);
          if(mode==='paint'){
            ensureAudio();
            const inst = INSTRUMENTS_BY_ID[track.instId];
            playMelodicInstrument(audioCtx.currentTime+0.02, noteFreq(note), inst, track.vol);
          }
          buildTrackList();
        };
        row.appendChild(cell);
      }
      inner.appendChild(row);
    });

    wrap.appendChild(inner);
    // scroll roughly to the middle (around C4) by default
    const scrollEl = document.getElementById('rollScroll');
    const middleIndex = NOTE_RANGE.indexOf('C4');
    if(middleIndex>=0){ scrollEl.scrollTop = Math.max(0, middleIndex*19 - 160); }
  }
  // Click-and-drag note painting, GarageBand-style: mousedown/touch on an empty
  // step starts "paint" (drag across steps to draw one long note); starting on
  // an already-active step starts "erase" (drag to clear a whole block at once).
  let rollDrag = null;
  function paintRollCell(step, ni, track, wrap, mode){
    if(step<0 || step>=totalSteps) return;
    const cur = track.pattern[step];
    if(mode==='erase'){
      if(cur===ni) track.pattern[step] = null;
    } else {
      if(cur!==ni) track.pattern[step] = ni;
    }
    // A step can only hold one note per track, so refresh every row in this column
    wrap.querySelectorAll(`.cell[data-step="${step}"]`).forEach(c=>{
      const cNi = Number(c.dataset.note);
      c.classList.toggle('active', track.pattern[step]===cNi);
    });
  }
  function refreshRollRowMerge(wrap, track, ni){
    wrap.querySelectorAll(`.cell[data-note="${ni}"]`).forEach(c=>{
      const i = Number(c.dataset.step);
      const active = track.pattern[i]===ni;
      c.classList.toggle('active', active);
      c.classList.toggle('run-start', active && track.pattern[i-1]!==ni);
      c.classList.toggle('run-end', active && track.pattern[i+1]!==ni);
    });
  }
  document.addEventListener('pointermove', (e)=>{
    if(!rollDrag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if(!el || !el.classList || !el.classList.contains('cell')) return;
    if(Number(el.dataset.note) !== rollDrag.ni) return; // stay within the row the drag started on
    const step = Number(el.dataset.step);
    if(step === rollDrag.lastStep) return;
    rollDrag.lastStep = step;
    paintRollCell(step, rollDrag.ni, rollDrag.track, rollDrag.wrap, rollDrag.mode);
    refreshRollRowMerge(rollDrag.wrap, rollDrag.track, rollDrag.ni);
  });
  document.addEventListener('pointerup', ()=>{ if(rollDrag){ rollDrag=null; buildTrackList(); } });
  document.addEventListener('pointercancel', ()=>{ if(rollDrag){ rollDrag=null; buildTrackList(); } });
  function scrollRollToStep(step){
    const scrollEl = document.getElementById('rollScroll');
    const cell = scrollEl.querySelector(`.cell[data-step="${step}"]`);
    if(cell) scrollEl.scrollLeft = Math.max(0, cell.offsetLeft - 100);
  }

  // ============================================================
  // Mixer
  // ============================================================
  function buildMixer(){
    const wrap = document.getElementById('mixer'); wrap.innerHTML='';
    tracks.forEach(track=>{
      const strip = document.createElement('div'); strip.className='strip';
      const name = document.createElement('div'); name.className='strip-name'; name.textContent = track.name;
      const slider = document.createElement('input'); slider.type='range'; slider.min=0; slider.max=100;
      slider.value = Math.round(track.vol*100);
      const val = document.createElement('div'); val.className='val mono'; val.textContent = slider.value+'%';
      slider.oninput = ()=>{ track.vol = slider.value/100; val.textContent = slider.value+'%'; };
      strip.appendChild(name); strip.appendChild(slider); strip.appendChild(val);
      wrap.appendChild(strip);
    });
    if(tracks.length===0){
      const e = document.createElement('div'); e.style.color='var(--text-dim)'; e.style.fontSize='12px';
      e.textContent = 'Add tracks to see mixer channels.';
      wrap.appendChild(e);
    }
  }

  function refreshAllUI(){
    buildSeqHeader();
    buildTrackList();
    buildMixer();
    if(selectedTrackId!==null){
      const t = tracks.find(tr=>tr.id===selectedTrackId);
      if(t) buildRollEditor(t); else closeRollEditor();
    }
  }

  // ============================================================
  // Virtual piano
  // ============================================================
  const OCTAVE_PATTERN = [
    {note:'C', black:false},{note:'C#', black:true},{note:'D', black:false},{note:'D#', black:true},
    {note:'E', black:false},{note:'F', black:false},{note:'F#', black:true},{note:'G', black:false},
    {note:'G#', black:true},{note:'A', black:false},{note:'A#', black:true},{note:'B', black:false},
  ];
  const KEY_MAP_BASE = {
    'a':'C','w':'C#','s':'D','e':'D#','d':'E','f':'F','t':'F#','g':'G','y':'G#','h':'A','u':'A#','j':'B',
    'k':'C1o','o':'C#1o','l':'D1o','p':'D#1o' // "1o" = one octave up from base key octave
  };

  function buildPianoInstrumentSelect(){
    const sel = document.getElementById('pianoInstrument');
    sel.innerHTML = '';
    CATEGORY_ORDER.forEach(cat=>{
      const list = MELODIC_INSTRUMENTS.filter(i=>i.cat===cat);
      if(list.length===0) return;
      const grp = document.createElement('optgroup'); grp.label = cat;
      list.forEach(inst=>{
        const opt = document.createElement('option'); opt.value = inst.id; opt.textContent = inst.name;
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    });
  }
  function playSelectedInstrument(fullNote){
    ensureAudio();
    const freq = noteFreq(fullNote);
    const instId = document.getElementById('pianoInstrument').value;
    const inst = INSTRUMENTS_BY_ID[instId] || MELODIC_INSTRUMENTS[0];
    const t = audioCtx.currentTime+0.01;
    playMelodicInstrument(t, freq, inst, inst.vol!==undefined?inst.vol:0.6);
  }
  function flashKey(fullNote){
    const el = document.querySelector(`.piano [data-note="${fullNote}"]`);
    if(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'), 160); }
  }
  function buildPiano(){
    const piano = document.getElementById('piano');
    piano.innerHTML='';
    const whiteW = 38, blackW = 24;
    let whiteCount = 0;
    const octaves = [1,2,3,4,5,6,7];
    octaves.forEach(oct=>{
      OCTAVE_PATTERN.forEach(k=>{
        const fullNote = k.note + oct;
        if(!k.black){
          const el = document.createElement('div');
          el.className='white-key'; el.dataset.note = fullNote;
          el.style.left = (whiteCount*whiteW)+'px';
          el.textContent = k.note==='C' ? fullNote : '';
          el.addEventListener('mousedown', ()=>{ playSelectedInstrument(fullNote); el.classList.add('active'); });
          el.addEventListener('mouseup', ()=>el.classList.remove('active'));
          el.addEventListener('mouseleave', ()=>el.classList.remove('active'));
          piano.appendChild(el); whiteCount++;
        } else {
          const el = document.createElement('div');
          el.className='black-key-piano'; el.dataset.note = fullNote;
          el.style.left = (whiteCount*whiteW - blackW/2)+'px';
          el.addEventListener('mousedown', ()=>{ playSelectedInstrument(fullNote); el.classList.add('active'); });
          el.addEventListener('mouseup', ()=>el.classList.remove('active'));
          el.addEventListener('mouseleave', ()=>el.classList.remove('active'));
          piano.appendChild(el);
        }
      });
    });
    const el = document.createElement('div');
    el.className='white-key'; el.dataset.note='C8';
    el.style.left = (whiteCount*whiteW)+'px'; el.textContent='C8';
    el.addEventListener('mousedown', ()=>{ playSelectedInstrument('C8'); el.classList.add('active'); });
    el.addEventListener('mouseup', ()=>el.classList.remove('active'));
    el.addEventListener('mouseleave', ()=>el.classList.remove('active'));
    piano.appendChild(el); whiteCount++;
    piano.style.width = (whiteCount*whiteW + 10)+'px';
    // scroll roughly to octave 3-4
    const pianoWrap = document.querySelector('.piano-wrap');
    pianoWrap.scrollLeft = 2*7*whiteW;
  }
  function updateOctLabel(){
    document.getElementById('octVal').textContent = 'Octave ' + keyboardOctave;
  }
  document.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    const key = e.key.toLowerCase();
    if(key==='z'){ keyboardOctave = Math.max(1, keyboardOctave-1); updateOctLabel(); return; }
    if(key==='x'){ keyboardOctave = Math.min(6, keyboardOctave+1); updateOctLabel(); return; }
    const mapped = KEY_MAP_BASE[key];
    if(mapped){
      let name = mapped, oct = keyboardOctave;
      if(mapped.endsWith('1o')){ name = mapped.slice(0,-2); oct = keyboardOctave+1; }
      const note = name + oct;
      playSelectedInstrument(note); flashKey(note);
    }
  });
  document.getElementById('octDown').onclick = ()=>{ keyboardOctave = Math.max(1, keyboardOctave-1); updateOctLabel(); };
  document.getElementById('octUp').onclick = ()=>{ keyboardOctave = Math.min(6, keyboardOctave+1); updateOctLabel(); };

  // ============================================================
  // Transport / bars / actions
  // ============================================================
  document.getElementById('playBtn').onclick = ()=>{ isPlaying ? stop() : play(); };
  document.getElementById('bpmInput').oninput = (e)=>{ bpm = Math.max(40, Math.min(220, parseInt(e.target.value)||120)); };
  document.getElementById('masterVol').oninput = (e)=>{ if(masterGain) masterGain.gain.value = e.target.value/100; };
  document.getElementById('addTrackBtn').onclick = ()=>{
    document.getElementById('instPicker').classList.toggle('open');
  };

  // Resizes every track's pattern to match a new bar count. No upper bound —
  // the song can grow to however many bars the browser's memory can hold.
  function setBars(newBars){
    newBars = Math.floor(newBars);
    if(!Number.isFinite(newBars) || newBars < 1) newBars = 1;
    if(newBars === bars){ document.getElementById('barsInput').value = bars; return; }
    bars = newBars;
    totalSteps = bars*STEP_PER_BAR;
    tracks.forEach(t=>{
      const fill = t.kind==='drum' ? false : null;
      if(t.pattern.length < totalSteps){
        for(let i=t.pattern.length;i<totalSteps;i++) t.pattern.push(fill);
      } else {
        t.pattern.length = totalSteps;
      }
    });
    refreshAllUI();
    setStatus('Now ' + bars + (bars===1?' bar':' bars') + '.');
  }
  document.getElementById('barPlus').onclick = ()=> setBars(bars+1);
  document.getElementById('barMinus').onclick = ()=> setBars(bars-1);
  document.getElementById('barsInput').onchange = (e)=> setBars(parseInt(e.target.value,10));

  document.getElementById('clearBtn').onclick = ()=>{
    tracks.forEach(t=>{ t.pattern.fill(t.kind==='drum' ? false : null); });
    refreshAllUI();
    setStatus('Pattern cleared.');
  };
  document.getElementById('randomizeBtn').onclick = ()=>{
    tracks.forEach(t=>{
      if(t.kind==='drum'){
        const nameLc = t.name.toLowerCase();
        let prob = 0.14;
        if(nameLc.includes('kick')) prob = 0.9;
        if(nameLc.includes('sub')) prob = 0.3;
        if(nameLc.includes('hat closed')) prob = 0.55;
        if(nameLc.includes('snare')) prob = 0.35;
        if(nameLc.includes('shak')||nameLc.includes('cabasa')) prob = 0.3;
        for(let i=0;i<totalSteps;i++){
          let p = prob;
          if(nameLc.includes('kick')) p = (i%4===0) ? 0.9 : 0.08;
          if(nameLc.includes('snare')) p = (i%8===4) ? 0.85 : 0.05;
          t.pattern[i] = Math.random() < p;
        }
      } else {
        for(let i=0;i<totalSteps;i++){
          t.pattern[i] = Math.random()<0.3 ? (20 + Math.floor(Math.random()*24)) : null;
        }
      }
    });
    refreshAllUI();
    setStatus('Randomized a new pattern.');
  };

  function setStatus(msg){
    document.getElementById('statusMsg').textContent = msg;
    setTimeout(()=>{ document.getElementById('statusMsg').textContent=''; }, 3500);
  }

  // ============================================================
  // Save / Load
  // ============================================================
  document.getElementById('saveBtn').onclick = async ()=>{
    try{
      const data = {
        bars, bpm,
        tracks: tracks.map(t=>({ id:t.id, name:t.name, instId:t.instId, kind:t.kind, pattern:t.pattern, vol:t.vol, mute:t.mute, solo:t.solo })),
        masterVol: document.getElementById('masterVol').value
      };
      const res = await window.storage.set('deck16:pattern', JSON.stringify(data), false);
      setStatus(res ? 'Pattern saved.' : 'Save failed.');
    }catch(err){ setStatus('Save failed — storage unavailable.'); }
  };
  document.getElementById('loadBtn').onclick = async ()=>{
    try{
      const res = await window.storage.get('deck16:pattern', false);
      if(!res){ setStatus('No saved pattern found.'); return; }
      const data = JSON.parse(res.value);
      bars = data.bars || 4; totalSteps = bars*STEP_PER_BAR; bpm = data.bpm || 120;
      tracks = (data.tracks||[]).filter(t=>INSTRUMENTS_BY_ID[t.instId]).map(t=>({
        id: nextTrackId++, name:t.name, instId:t.instId, kind:t.kind,
        pattern: (t.pattern||[]).slice(0,totalSteps).concat(new Array(Math.max(0,totalSteps-(t.pattern||[]).length)).fill(t.kind==='drum'?false:null)),
        vol: t.vol!==undefined?t.vol:0.6, mute: !!t.mute, solo: !!t.solo
      }));
      document.getElementById('bpmInput').value = bpm;
      if(data.masterVol!==undefined) document.getElementById('masterVol').value = data.masterVol;
      selectedTrackId = null;
      document.getElementById('rollEditorPanel').classList.remove('open');
      refreshAllUI();
      setStatus('Pattern loaded.');
    }catch(err){ setStatus('No saved pattern found.'); }
  };
  document.getElementById('closeRollBtn').onclick = closeRollEditor;

  // ============================================================
  // MIDI export
  // ============================================================
  const TICKS_PER_QUARTER = 96, TICKS_PER_STEP = TICKS_PER_QUARTER/4;

  function writeVarLen(value){
    let buffer = value & 0x7F;
    while((value >>= 7) > 0){ buffer <<= 8; buffer |= ((value & 0x7F) | 0x80); }
    const bytes = [];
    while(true){ bytes.push(buffer & 0xFF); if(buffer & 0x80) buffer >>= 8; else break; }
    return bytes;
  }
  function u16(n){ return [(n>>8)&0xFF, n&0xFF]; }
  function u32(n){ return [(n>>24)&0xFF,(n>>16)&0xFF,(n>>8)&0xFF,n&0xFF]; }
  function strBytes(s){ return Array.from(s).map(c=>c.charCodeAt(0)); }
  function midiChunk(id, bytes){ return [...strBytes(id), ...u32(bytes.length), ...bytes]; }
  function buildTempoTrack(){
    const microPerQuarter = Math.round(60000000/bpm);
    let bytes = [];
    bytes.push(0x00,0xFF,0x51,0x03,(microPerQuarter>>16)&0xFF,(microPerQuarter>>8)&0xFF,microPerQuarter&0xFF);
    bytes.push(0x00,0xFF,0x58,0x04,4,2,24,8);
    const name = 'DECK16';
    bytes.push(0x00,0xFF,0x03,name.length,...strBytes(name));
    bytes.push(0x00,0xFF,0x2F,0x00);
    return bytes;
  }
  function drumEvents(pattern, note, channel, lenTicks){
    const events=[];
    for(let i=0;i<totalSteps;i++){
      if(pattern[i]){
        events.push({tick:i*TICKS_PER_STEP, type:'on', note, vel:100, ch:channel});
        events.push({tick:i*TICKS_PER_STEP+lenTicks, type:'off', note, vel:0, ch:channel});
      }
    }
    return events;
  }
  function melodicEvents(pattern, channel, lenTicks){
    const events=[];
    for(let i=0;i<totalSteps;i++){
      const idx = pattern[i];
      if(idx!==null && idx!==undefined){
        const note = noteNameToMidi(NOTE_RANGE[idx]);
        events.push({tick:i*TICKS_PER_STEP, type:'on', note, vel:100, ch:channel});
        events.push({tick:i*TICKS_PER_STEP+lenTicks, type:'off', note, vel:0, ch:channel});
      }
    }
    return events;
  }
  function eventsToTrackBytes(events, trackName, program, channel){
    events.sort((a,b)=> a.tick-b.tick || (a.type==='off' ? -1 : 1));
    let bytes = [];
    bytes.push(0x00,0xFF,0x03,trackName.length,...strBytes(trackName));
    if(program!==undefined) bytes.push(0x00, 0xC0|channel, program);
    let lastTick = 0;
    events.forEach(e=>{
      const delta = e.tick - lastTick; lastTick = e.tick;
      bytes.push(...writeVarLen(delta));
      if(e.type==='on') bytes.push(0x90|e.ch, e.note, e.vel);
      else bytes.push(0x80|e.ch, e.note, 0);
    });
    const endDelta = Math.max(0, totalSteps*TICKS_PER_STEP - lastTick);
    bytes.push(...writeVarLen(endDelta), 0xFF,0x2F,0x00);
    return bytes;
  }
  function exportMIDI(){
    const trackChunks = [ midiChunk('MTrk', buildTempoTrack()) ];
    let melodicChannel = 0;
    tracks.forEach(track=>{
      const inst = INSTRUMENTS_BY_ID[track.instId];
      if(!inst) return;
      if(track.kind==='drum'){
        if(track.pattern.some(x=>x)){
          const note = DRUM_MIDI_MAP[track.instId] !== undefined ? DRUM_MIDI_MAP[track.instId] : 37;
          const ev = drumEvents(track.pattern, note, 9, 12);
          trackChunks.push(midiChunk('MTrk', eventsToTrackBytes(ev, track.name, undefined, 9)));
        }
      } else {
        if(track.pattern.some(x=>x!==null && x!==undefined)){
          let ch = melodicChannel % 16; if(ch===9) ch = (melodicChannel+1)%16;
          melodicChannel++;
          const program = CATEGORY_PROGRAM[inst.cat] !== undefined ? CATEGORY_PROGRAM[inst.cat] : 0;
          const ev = melodicEvents(track.pattern, ch, 22);
          trackChunks.push(midiChunk('MTrk', eventsToTrackBytes(ev, track.name, program, ch)));
        }
      }
    });
    if(trackChunks.length===1){ setStatus('Nothing to export — add some steps first.'); return; }
    const header = midiChunk('MThd', [...u16(1), ...u16(trackChunks.length), ...u16(TICKS_PER_QUARTER)]);
    const allBytes = new Uint8Array([...header, ...trackChunks.flat()]);
    const blob = new Blob([allBytes], {type:'audio/midi'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'deck16-pattern.mid';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('MIDI file exported.');
  }
  document.getElementById('exportMidiBtn').onclick = exportMIDI;

  // ---------- Audio export (renders the whole pattern offline, then saves a .wav) ----------
  function audioBufferToWavBlob(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const numFrames = buffer.length;
    const blockAlign = numChannels*2;
    const dataSize = numFrames*blockAlign;
    const ab = new ArrayBuffer(44+dataSize);
    const view = new DataView(ab);
    const writeStr = (offset, str)=>{ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
    writeStr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate*blockAlign, true); view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true);
    writeStr(36,'data'); view.setUint32(40, dataSize, true);
    const channelData = []; for(let ch=0; ch<numChannels; ch++) channelData.push(buffer.getChannelData(ch));
    let offset = 44;
    for(let i=0;i<numFrames;i++){
      for(let ch=0; ch<numChannels; ch++){
        let s = Math.max(-1, Math.min(1, channelData[ch][i]));
        s = s<0 ? s*0x8000 : s*0x7FFF;
        view.setInt16(offset, s, true); offset += 2;
      }
    }
    return new Blob([ab], {type:'audio/wav'});
  }
  async function exportAudio(){
    const hasNotes = tracks.some(t=> t.kind==='drum' ? t.pattern.some(x=>x) : t.pattern.some(x=>x!==null && x!==undefined));
    if(!hasNotes){ setStatus('Nothing to export — add some steps first.'); return; }
    const btn = document.getElementById('exportAudioBtn');
    const savedLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Rendering…';
    setStatus('Rendering audio…');
    // Temporarily point the shared audio engine at an offline context so the
    // existing playDrumInstrument/playMelodicInstrument code can render silently.
    const savedAudioCtx = audioCtx, savedMasterGain = masterGain;
    try{
      const secondsPerStep = (60/bpm)/4;
      const tailSeconds = 3.0; // let long pads/decays ring out fully
      const duration = totalSteps*secondsPerStep + tailSeconds;
      const sampleRate = 44100;
      const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(sampleRate*duration), sampleRate);
      audioCtx = offlineCtx;
      masterGain = offlineCtx.createGain();
      masterGain.gain.value = document.getElementById('masterVol').value/100;
      masterGain.connect(offlineCtx.destination);

      const anySolo = tracks.some(t=>t.solo);
      for(let step=0; step<totalSteps; step++){
        const time = step*secondsPerStep;
        tracks.forEach(track=>{
          if(track.mute) return;
          if(anySolo && !track.solo) return;
          const inst = INSTRUMENTS_BY_ID[track.instId];
          if(!inst) return;
          const val = track.pattern[step];
          if(track.kind==='drum'){
            if(val) playDrumInstrument(time, inst, track.vol);
          } else if(track.kind==='melodic'){
            if(val!==null && val!==undefined) playMelodicInstrument(time, noteFreq(NOTE_RANGE[val]), inst, track.vol);
          }
        });
      }

      // Report progress: schedule suspend/resume checkpoints through the render
      // so the button and status can show a live percentage as it renders.
      const showProgress = (pct)=>{
        setStatus('Rendering audio… ' + pct + '%');
        btn.textContent = 'Rendering ' + pct + '%…';
      };
      showProgress(0);
      const numCheckpoints = 20;
      for(let c=1; c<numCheckpoints; c++){
        const checkTime = duration * c / numCheckpoints;
        offlineCtx.suspend(checkTime).then(()=>{
          showProgress(Math.round(c/numCheckpoints*100));
          offlineCtx.resume();
        });
      }

      const rendered = await offlineCtx.startRendering();
      showProgress(100);
      const blob = audioBufferToWavBlob(rendered);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'deck16-pattern.wav';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('Audio file exported.');
    } catch(err){
      setStatus('Could not render audio.');
    } finally {
      audioCtx = savedAudioCtx; masterGain = savedMasterGain;
      btn.disabled = false; btn.textContent = savedLabel;
    }
  }
  document.getElementById('exportAudioBtn').onclick = exportAudio;

  // ---------- MIDI import ----------
  function parseMidiFile(arrayBuffer){
    const data = new Uint8Array(arrayBuffer);
    let pos = 0;
    function readStr(len){ let s=''; for(let i=0;i<len;i++) s+=String.fromCharCode(data[pos++]); return s; }
    function readUint32(){ const v = (data[pos]<<24)|(data[pos+1]<<16)|(data[pos+2]<<8)|data[pos+3]; pos+=4; return v>>>0; }
    function readUint16(){ const v=(data[pos]<<8)|data[pos+1]; pos+=2; return v; }
    function readVarLen(){
      let value=0, byte;
      do{ byte = data[pos++]; value = (value<<7) | (byte & 0x7F); } while(byte & 0x80);
      return value;
    }
    readStr(4); readUint32(); readUint16();
    const numTracks = readUint16();
    const division = readUint16();
    const noteOnEvents = [];
    const programChanges = {};
    for(let t=0;t<numTracks;t++){
      readStr(4);
      const trackLen = readUint32();
      const trackEnd = pos + trackLen;
      let tick = 0, runningStatus = null;
      while(pos < trackEnd){
        tick += readVarLen();
        let statusByte = data[pos];
        if(statusByte & 0x80){ pos++; runningStatus = statusByte; } else { statusByte = runningStatus; }
        const type = statusByte & 0xF0, channel = statusByte & 0x0F;
        if(type === 0x90){
          const note = data[pos++], vel = data[pos++];
          if(vel>0) noteOnEvents.push({tick, note, channel});
        } else if(type === 0x80){ pos+=2; }
        else if(type===0xA0 || type===0xB0 || type===0xE0){ pos+=2; }
        else if(type===0xC0){
          const program = data[pos++];
          if(programChanges[channel]===undefined) programChanges[channel] = program;
        }
        else if(type===0xD0){ pos+=1; }
        else if(statusByte === 0xFF){ pos++; const len = readVarLen(); pos += len; }
        else if(statusByte === 0xF0 || statusByte === 0xF7){ const len = readVarLen(); pos += len; }
        else { pos = trackEnd; }
      }
      pos = trackEnd;
    }
    return { division, noteOnEvents, programChanges };
  }
  // GM-ish program number -> instrument category, for auto-creating melodic tracks
  function categoryForProgram(program){
    if(program===undefined || program===null) return 'Keys';
    if(program<8) return 'Keys';
    if(program<16) return 'Plucks';
    if(program<24) return 'Keys';
    if(program<32) return 'Plucks';
    if(program<40) return 'Bass';
    if(program<48) return 'Pads & Strings';
    if(program<56) return 'Pads & Strings';
    if(program<64) return 'Wind & Brass';
    if(program<72) return 'Wind & Brass';
    if(program<80) return 'Wind & Brass';
    if(program<88) return 'Leads';
    if(program<96) return 'Pads & Strings';
    if(program<104) return 'FX & Chip';
    if(program<112) return 'World Melodic';
    if(program<120) return 'Plucks';
    return 'FX & Chip';
  }
  function instrumentForProgram(program){
    const cat = categoryForProgram(program);
    const list = MELODIC_INSTRUMENTS.filter(i=>i.cat===cat);
    return list[0] || MELODIC_INSTRUMENTS[0];
  }
  function nearestDrumInstId(midiNote){
    let best = DRUM_INSTRUMENTS[0].id, bd = 999;
    DRUM_INSTRUMENTS.forEach(inst=>{
      const mapped = DRUM_MIDI_MAP[inst.id];
      const d = Math.abs(mapped - midiNote);
      if(d < bd){ bd = d; best = inst.id; }
    });
    return best;
  }
  function nearestNoteIndex(midiNote){
    let bestIdx=0, bestDist=999;
    NOTE_RANGE.forEach((n,i)=>{ const d=Math.abs(noteNameToMidi(n)-midiNote); if(d<bestDist){bestDist=d; bestIdx=i;} });
    return bestIdx;
  }
  async function importMIDI(file){
    try{
      const buf = await file.arrayBuffer();
      const { division, noteOnEvents, programChanges } = parseMidiFile(buf);
      if(noteOnEvents.length===0){ setStatus('No notes found in that MIDI file.'); return; }
      const stepTicks = division/4;

      // 1) Auto-size the bar count to fit the imported song
      let maxTick = 0;
      noteOnEvents.forEach(ev=>{ if(ev.tick > maxTick) maxTick = ev.tick; });
      const neededSteps = Math.max(STEP_PER_BAR, Math.ceil((maxTick + stepTicks) / stepTicks));
      const neededBars = Math.max(1, Math.ceil(neededSteps / STEP_PER_BAR));
      bars = neededBars;
      totalSteps = bars * STEP_PER_BAR;

      // 2) Work out which drum instruments & melodic channels the file needs
      const neededDrumInstIds = new Set();
      noteOnEvents.forEach(ev=>{ if(ev.channel===9) neededDrumInstIds.add(nearestDrumInstId(ev.note)); });
      const neededChannels = Array.from(new Set(noteOnEvents.filter(ev=>ev.channel!==9).map(ev=>ev.channel))).sort((a,b)=>a-b);

      // 3) Reuse existing matching tracks where possible, auto-add the rest
      let addedCount = 0;
      const drumInstIdToTrack = {};
      tracks.filter(t=>t.kind==='drum').forEach(t=>{
        if(neededDrumInstIds.has(t.instId) && !drumInstIdToTrack[t.instId]) drumInstIdToTrack[t.instId] = t;
      });
      neededDrumInstIds.forEach(instId=>{
        if(!drumInstIdToTrack[instId]){
          const inst = INSTRUMENTS_BY_ID[instId];
          if(inst){
            const t = newTrackFromInstrument(inst);
            tracks.push(t);
            drumInstIdToTrack[instId] = t;
            addedCount++;
          }
        }
      });

      const existingMelodic = tracks.filter(t=>t.kind==='melodic');
      const channelToTrack = {};
      let reuseIdx = 0;
      neededChannels.forEach(ch=>{
        if(reuseIdx < existingMelodic.length){
          channelToTrack[ch] = existingMelodic[reuseIdx];
          reuseIdx++;
        } else {
          const inst = instrumentForProgram(programChanges[ch]);
          const t = newTrackFromInstrument(inst);
          tracks.push(t);
          channelToTrack[ch] = t;
          addedCount++;
        }
      });

      // 4) Resize every track's pattern to the new song length and clear it
      tracks.forEach(t=>{
        const fill = t.kind==='drum' ? false : null;
        t.pattern = new Array(totalSteps).fill(fill);
      });

      // 5) Place the notes
      let placed = 0;
      const songTicks = totalSteps * stepTicks;
      noteOnEvents.forEach(ev=>{
        if(ev.tick >= songTicks) return;
        const step = Math.min(totalSteps-1, Math.round(ev.tick/stepTicks));
        if(ev.channel === 9){
          const track = drumInstIdToTrack[nearestDrumInstId(ev.note)];
          if(track){ track.pattern[step] = true; placed++; }
        } else {
          const track = channelToTrack[ev.channel];
          if(track){ track.pattern[step] = nearestNoteIndex(ev.note); placed++; }
        }
      });

      refreshAllUI();
      let msg = 'MIDI imported — ' + bars + (bars===1?' bar':' bars');
      if(addedCount>0) msg += ', added ' + addedCount + ' instrument track' + (addedCount===1?'':'s') + ' automatically.';
      setStatus(placed>0 ? msg : 'MIDI file had no usable note data.');
    }catch(err){ setStatus('Could not read that MIDI file.'); }
  }
  document.getElementById('importMidiBtn').onclick = ()=> document.getElementById('midiFileInput').click();
  document.getElementById('midiFileInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importMIDI(file);
    e.target.value = '';
  };

  // ============================================================
  // Init
  // ============================================================
  function addDefaultTrack(instId){
    const inst = INSTRUMENTS_BY_ID[instId];
    if(inst) tracks.push(newTrackFromInstrument(inst));
  }
  addDefaultTrack('kick808');
  addDefaultTrack('snareAcoustic');
  addDefaultTrack('hatClosed');
  addDefaultTrack('clap');
  addDefaultTrack('subBass');
  addDefaultTrack('grandPiano');

  buildInstrumentPicker();
  buildPianoInstrumentSelect();
  buildSeqHeader();
  buildTrackList();
  buildMixer();
  buildPiano();
  updateOctLabel();
})();

</script>
